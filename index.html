<style>
/* Layout: phone = preview pinned on top, editor scrolls beneath; desktop = preview left, editor right.
   Tokens: paper-grey ground, orange accent (same hue family as the reference clip), mono for timecodes. */
:root{

  --accent:#D9481A; --accent-ink:#FFFFFF; --ok:#1F7A4D; --bad:#B3261E;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121315; --surface:#1B1C1F; --field:#151618; --fg:#ECEBE6; --muted:#9A9BA2; --line:#2C2E33;
    --accent:#FF7440; --accent-ink:#1A0D07; --ok:#59C48A; --bad:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1B1C1F; --field:#151618; --fg:#ECEBE6; --muted:#9A9BA2; --line:#2C2E33;
  --accent:#FF7440; --accent-ink:#1A0D07; --ok:#59C48A; --bad:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--fg); font:15px/1.45 var(--f-body);
  padding-block:0 48px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:1040px;margin:0 auto}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 6px}
.brand{font:800 22px/1 var(--f-display);letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.tag{color:var(--muted);font-size:13px}
.layout{display:grid;gap:0 36px;grid-template-columns:minmax(0,1fr)}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:10px}

.frame canvas{display:block;width:100%;height:100%}
.transport{display:flex;align-items:center;gap:12px;width:100%;max-width:420px}
.play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:16px;cursor:pointer;display:grid;place-items:center}
.play:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.transport input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:32px}
.time{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface);box-shadow:0 0 0 1px var(--line);margin:8px 0 14px}
.tabs button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:500 13.5px var(--f-body);cursor:pointer;padding:0 4px}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--bg)}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.hint code{font:500 12px var(--f-mono);background:var(--surface);padding:1px 5px;border-radius:5px;box-shadow:0 0 0 1px var(--line)}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:14px;padding:12px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.card.is-active{box-shadow:0 0 0 2px var(--accent)}
.card header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seek{border:0;background:none;padding:6px 0;font:700 14px var(--f-body);color:var(--fg);cursor:pointer;text-align:left}
.seek span{font:500 12px var(--f-mono);color:var(--muted);margin-left:8px}
.acts{display:flex;gap:2px}
.acts button{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:16px;cursor:pointer}
.acts button:hover{background:var(--field);color:var(--fg)}
.acts button:disabled{opacity:.3;cursor:default}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--fg)}

input[type=text],input[type=password],input[type=number],select,textarea{width:100%;font:400 15px var(--f-body);color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
textarea{resize:vertical;line-height:1.35}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px var(--f-body);cursor:pointer}

.add{width:100%;margin-top:12px;border-style:dashed}

.sec h3{margin:0;font:800 15px var(--f-display);letter-spacing:-.01em}
.sec summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
.sec details{display:flex;flex-direction:column;gap:12px}
.sec details>summary{margin-bottom:12px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{border:2px solid var(--line);background:var(--field);border-radius:12px;padding:8px;cursor:pointer;color:var(--fg);font:500 13px var(--f-body);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip[aria-pressed=true]{border-color:var(--accent)}
.sw{width:100%;height:34px;border-radius:7px;display:flex;align-items:flex-end;padding:5px 6px;font:800 12px var(--f-display)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.meta dt{color:var(--muted)} .meta dd{margin:0;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent)}
.note{font-size:13px;color:var(--muted);margin:0}
.note.bad{color:var(--bad)} .note.ok{color:var(--ok)}
.note a{color:var(--accent)}
.imgrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start}
.thumb{width:64px;aspect-ratio:9/16;border-radius:9px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imgctl{display:flex;flex-direction:column;gap:8px;min-width:0}
.imgctl .row .btn{min-height:38px;padding:0 10px;font-size:13px}
.imgctl .rowx{display:flex;gap:8px;flex-wrap:wrap}.imgctl .rowx .btn{flex:1 1 90px;min-height:38px;padding:0 10px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn input[type=file]{display:none}
#sline{margin:0;max-width:420px;text-align:center;font-size:12px}
.result{display:flex;flex-direction:column;align-items:center;gap:10px}
.result video{height:min(46vh,480px);max-width:100%;aspect-ratio:9/16;border-radius:12px;background:#000}
.card details{display:flex;flex-direction:column;gap:10px}
.card details>summary{cursor:pointer;font-size:13.5px;color:var(--muted);padding:4px 0}
textarea.code{font:500 12.5px/1.4 var(--f-mono);white-space:pre;overflow:auto;tab-size:2}
@media (min-width:880px){
  .layout{grid-template-columns:360px minmax(0,1fr);align-items:start}
  .stage{top:16px;padding-top:12px}
  .frame{height:min(72vh,640px)}
  body::before{display:none}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}

</div>

/* ---------- layout of one scene (virtual 720x1280 units) ---------- */
function parseRuns(text){
  var words=[], prevOpen=false;
  String(text).split("*").forEach(function(seg,i){
    var a=i%2===1, parts=seg.split(/(\s+)/), glue=prevOpen&&seg.length>0&&!/^\s/.test(seg)&&words.length>0;
    parts.forEach(function(p){
      if(!p) return;
      if(/^\s+$/.test(p)){glue=false;return}
      words.push({t:p,a:a,g:glue});glue=false;
    });
    if(seg.length) prevOpen=!/\s$/.test(seg);
  });
  return words;
}
function wrap(words,maxW){
  var sp=ctx.measureText(" ").width, lines=[], cur={words:[],w:0};
  words.forEach(function(wd){
    var w=ctx.measureText(wd.t).width, gap=cur.words.length?(wd.g?0:sp):0;
    if(cur.words.length&&cur.w+gap+w>maxW){lines.push(cur);cur={words:[],w:0};gap=0}
    cur.words.push({t:wd.t,a:wd.a,x:cur.w+gap,w:w});cur.w+=gap+w;
  });
  if(cur.words.length)lines.push(cur);
  return lines;
}
function stagFor(n){return n?Math.min(0.08,1.0/n):0.08}
function layout(sc){

  if(cache[key])return cache[key];
  var words=parseRuns(sc.text), size=108, lines=[];
  for(;size>=48;size-=4){
    ctx.font="800 "+size+"px "+HF;
    lines=wrap(words,MAXW);
    if(lines.length<=5&&lines.every(function(l){return l.w<=MAXW+1}))break;
  }
  var lh=size*1.1, n=0, cb=0;
  lines.forEach(function(l){l.words.forEach(function(w){w.i=n++;w.cb=cb;cb+=w.t.length+1})});
  var bl=String(sc.bullets||"").split("\n").map(function(s){return s.trim()}).filter(Boolean).slice(0,6);
  var bullets=bl.map(function(t){
    var fs=40;ctx.font="500 "+fs+"px "+BF;
    while(fs>26&&ctx.measureText(t).width>MAXW-92){fs-=2;ctx.font="500 "+fs+"px "+BF}
    return {t:t,fs:fs};
  });
  var labelH=sc.label?40:0, gap1=sc.label?22:0;
  var headH=lines.length*lh, gap2=bullets.length?50:0, bH=bullets.length?bullets.length*82-16:0;
  var tot=labelH+gap1+headH+gap2+bH;
  var y=(H-tot)/2-30, imgBox=null;

    var imgH=clamp(H-150-120-tot-44,340,660);
    imgBox={y:150,h:imgH};y=150+imgH+44;

    y=H-135-tot;
  }
  var out={size:size,lh:lh,n:n,cb:cb,lines:lines,bullets:bullets,labelY:y+labelH/2,label:sc.label,img:imgBox,mode:mode};
  y+=labelH+gap1;
  lines.forEach(function(l,i){l.y=y+lh*(i+.5)});
  y+=headH+gap2;
  bullets.forEach(function(b,i){b.y=y+82*i+33});
  cache[key]=out;return out;
}
function minSceneDur(sc){
  var L=layout(sc);
  return L.bullets.length?(0.2+L.n*stagFor(L.n)+0.25+(L.bullets.length-1)*0.22+1.1):0;
}

/* ---------- drawing ---------- */
function locate(t){
  var acc=0;
  for(var i=0;i<S.scenes.length;i++){
    var d=+S.scenes[i].dur||1;
    if(t<acc+d||i===S.scenes.length-1)return {i:i,start:acc,lt:clamp(t-acc,0,d),dur:d};
    acc+=d;
  }
}
function drawCover(img,x,y,w,h,z,px){
  var iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height; if(!iw||!ih)return;
  var s=Math.max(w/iw,h/ih)*z, dw=iw*s, dh=ih*s;
  ctx.drawImage(img,x+(w-dw)/2+px*(dw-w)/2,y+(h-dh)/2,dw,dh);
}
function frameOf(im,lt){
  if(im.fr&&im.fr.length){var f=im.fr[Math.floor(lt*(im.fps||8))%im.fr.length];if(f&&f.complete&&f.naturalWidth)return f}
  return im.el;
}

function localSplit(raw){
  var t=String(raw).replace(/\r/g,"").trim(), sents=[];
  t.split(/\n+/).forEach(function(par){
    var m=par.match(/[^.!?…]+[.!?…]*["”)]*\s*/g)||[];
    m.forEach(function(s){s=s.trim();if(s)sents.push(s)});
  });
  var chunks=[];
  sents.forEach(function(s){
    if(chunks.length){
      var prev=chunks[chunks.length-1];
      if(prev.length<34&&(prev+" "+s).length<=120){chunks[chunks.length-1]=prev+" "+s;return}
    }
    chunks.push(s);
  });
  var out=[];
  chunks.forEach(function(c){
    if(c.length<=125){out.push(c);return}
    var mid=c.length/2,best=-1,bd=1e9,re=/,\s|;\s|\sdan\s|\stapi\s|\satau\s|\syang\s/g,m;
    while((m=re.exec(c))){var d=Math.abs(m.index-mid);if(d<bd){bd=d;best=m.index+(c[m.index]===","||c[m.index]===";"?1:0)}}
    if(best>20&&best<c.length-20){out.push(c.slice(0,best).trim());out.push(c.slice(best).replace(/^[,;]\s*/,"").trim())}
    else out.push(c);
  });
  var anims=["reveal","pop","slide"];
  return out.map(function(c,i){
    var disp=c.replace(/[.…]+$/,"").trim(), bl="";
    var ci=disp.indexOf(":");
    if(ci>=15&&ci<disp.length-6){
      var items=disp.slice(ci+1).split(/,\s*|\s+dan\s+|\s+serta\s+/).map(function(x){return x.replace(/^(dan|serta)\s+/,"").trim()}).filter(Boolean);
      if(items.length>=2&&items.length<=5){bl=items.map(function(x){return x.length>38?x.slice(0,36).replace(/\s+\S*$/,"")+"…":x.charAt(0).toUpperCase()+x.slice(1)}).join("\n");disp=disp.slice(0,ci)}
    }
    if(!bl&&disp.length>75){var cm=disp.indexOf(", ");if(cm>=25&&cm<=75)disp=disp.slice(0,cm)}
    var done=false;
    disp=disp.replace(/(\d[\d.,]*)(\s?[A-Za-zµ%°]+)?/,function(m){done=true;return "*"+m.trim()+"*"});
    if(!done){
      var ws=disp.split(/\s+/),bi=-1,bl=0;
      ws.forEach(function(w,j){var L2=w.replace(/[^\p{L}]/gu,"").length;if(L2>bl&&L2>=6){bl=L2;bi=j}});
      if(bi>-1){ws[bi]="*"+ws[bi]+"*";disp=ws.join(" ")}
    }
    disp=disp.replace(/\*([^*]*?)([,.;:!?]+)\*/g,"*$1*$2");
    var s={id:uid(),label:"",text:disp,bullets:bl,dur:4,anim:anims[i%3],speech:c};
    s.dur=Math.max(2.5,Math.round(c.length/14*10)/10);
    return s;
  });
}

function pcm16ToWav(bytes,rate){
  var n=bytes.length, b=new ArrayBuffer(44+n), v=new DataView(b);
  function ws(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}
  ws(0,"RIFF");v.setUint32(4,36+n,true);ws(8,"WAVE");ws(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,"data");v.setUint32(40,n,true);
  new Uint8Array(b,44).set(bytes);return b;
}
async function ttsOne(text,ac,key){
  var attempt=0;
  for(;;){
    try{
      var j=await ttsRequest(text,key), a=findAudio(j);
      if(!a)throw new Error("Respons Gemini tidak berisi audio");
      var bytes=b64bytes(a.data), ab;
      if(bytes[0]===82&&bytes[1]===73&&bytes[2]===70&&bytes[3]===70)ab=bytes.buffer;
      else{var r=/rate=(\d+)/.exec(a.mime||"");ab=pcm16ToWav(bytes,r?+r[1]:24000)}
      var buf=await ac.decodeAudioData(ab.slice(0));
      return {pcm:trim(buf.getChannelData(0),buf.sampleRate),rate:buf.sampleRate};
    }catch(e){
      attempt++;
      if(e.blocked||attempt>3||(e.status&&e.status!==429&&e.status<500))throw e;
      var wait=e.status===429?retryDelay(e):4*attempt;
      if(wait>MAX_WAIT){e.message+=" (batas harian atau terlalu lama menunggu: "+Math.round(wait/60)+" menit)";throw e}
      for(var s=wait;s>0;s--){setMsg("Menunggu "+s+" dtk sebelum mencoba lagi ("+(e.status===429?"batas kuota":"gangguan sementara")+")…","bad");await new Promise(function(r){setTimeout(r,1000)})}
    }
  }
}
function trim(d,rate){
  var th=0.012,a=0,b=d.length-1;
  while(a<b&&Math.abs(d[a])<th)a++;
  while(b>a&&Math.abs(d[b])<th)b--;
  a=Math.max(0,a-Math.round(rate*0.05));b=Math.min(d.length-1,b+Math.round(rate*0.08));
  return d.slice(a,b+1);
}
function floatToWav(f,rate){
  var b=new ArrayBuffer(f.length*2), v=new DataView(b);
  for(var i=0;i<f.length;i++){var s=clamp(f[i],-1,1);v.setInt16(i*2,s<0?s*32768:s*32767,true)}
  return new Blob([pcm16ToWav(new Uint8Array(b),rate)],{type:"audio/wav"});
}
async function makeVoice(){
  if(busy)return;
  if(!apiKey){setMsg("Isi API key Gemini dulu.","bad");return}
  var n=S.scenes.length;
  setBusy(true);pause();setBar(0);
  var AC=window.AudioContext||window.webkitAudioContext, ac;
  try{ac=new AC({sampleRate:24000})}catch(e){ac=new AC()}
  var rate=ac.sampleRate, parts=[];
  try{
    for(var i=0;i<n;i++){
      var sc=S.scenes[i], text=(sc.speech||sc.text.replace(/\*/g,"")).trim();
      var ck=[S.gem.tts,S.gem.voice,S.gem.style,rate,text].join("\u0001"), hit=ttsCache[ck];
      if(!hit){setMsg("Membuat suara adegan "+(i+1)+" dari "+n+"…");hit=await ttsOne(text,ac,apiKey);ttsCache[ck]=hit}
      parts.push(hit);setBar((i+1)/n);
    }
    var lead=0.2, tail=0.4, durs=parts.map(function(p,i){
      return Math.max(1.5,Math.round((lead+p.pcm.length/p.rate+tail)*10)/10,Math.round(minSceneDur(S.scenes[i])*10)/10);
    });
    var tot=durs.reduce(function(a,b){return a+b},0), out=new Float32Array(Math.ceil(tot*rate)), at=0;
    parts.forEach(function(p,i){
      var o=Math.round((at+lead)*rate);out.set(p.pcm.subarray(0,Math.max(0,Math.min(p.pcm.length,out.length-o))),o);at+=durs[i];
    });
    S.scenes.forEach(function(s,i){s.dur=durs[i]});
    save();
    await loadAudio(new File([floatToWav(out,rate)],"suara-gemini.wav",{type:"audio/wav"}));
    audio.tts=true;audio.sig=sig();
    try{ac.close()}catch(e){}
    setBusy(false);playT=0;renderPanel();render();
    setMsg("Suara selesai: "+fmt(tot)+". Durasi tiap adegan sudah disesuaikan. Tekan putar untuk mencoba.","ok");
  }catch(e){
    try{ac.close()}catch(e2){}
    setBusy(false);setBar(null);setMsg("Gagal membuat suara: "+(e&&e.message||e),"bad");
  }
}

   '<button class="btn" id="mkmaster"'+(busy?" disabled":"")+'>Buat master prompt dari naskah</button>'+
   '<label class="chk"><input type="checkbox" id="gref"'+(g.imgRef?" checked":"")+'> Pakai gambar adegan 1 sebagai acuan gaya</label>'+
   '<p class="note">Salin semua prompt, tempel satu per satu di gemini.google.com (minta rasio 9:16), simpan hasilnya, lalu unggah sekaligus di sini. Gambar diurutkan menurut nama file dan dipasang ke adegan 1, 2, 3 dan seterusnya.</p>'+
   '<button class="btn" id="cpprompts">Salin semua prompt gambar</button>'+
   '<label class="btn">Unggah banyak gambar sekaligus<input type="file" accept="image/*" multiple id="bulkimg"></label></details>'+
   '<div class="bar" id="gbar" hidden><i></i></div>'+
   '<p class="note'+(stale?" bad":"")+'" id="gmsg">'+(stale?"Adegan berubah setelah suara dibuat. Buat suara lagi agar sinkron.":(audio.tts?"Suara Gemini aktif ("+fmt(audio.dur)+"). Adegan yang tidak berubah tidak dibuat ulang.":"Durasi tiap adegan otomatis mengikuti panjang suaranya."))+'</p></div>';
}
function styleHTML(){
  var chips=Object.keys(THEMES).map(function(k){var t=THEMES[k];
    return '<button class="chip" data-theme-pick="'+k+'" aria-pressed="'+(S.theme===k)+'"><span class="sw" style="background:linear-gradient(135deg,'+t.bg1+','+t.bg2+');color:'+t.accent+'">Aa</span>'+t.name+'</button>'}).join("");
  var a=audio.buf?('<p class="note ok">'+esc(audio.name)+' · '+fmt(audio.dur)+' (video '+fmt(total())+')</p><div class="row">'+(audio.tts?'':'<button class="btn" data-act="fit">Samakan durasi ke suara</button>')+'<button class="btn" data-act="noaudio">Hapus suara</button></div>')
    :'<p class="note">Belum ada suara. Buat dengan Gemini di tab Naskah, atau pilih file voice-over (mp3, m4a, wav) dari HP.</p>';
  return '<div class="sec"><h3>Warna video</h3><div class="chips">'+chips+'</div></div>'+
  '<div class="sec"><h3>Tampilan</h3><label class="f">Nama akun di bagian bawah<input type="text" id="handle" value="'+esc(S.handle)+'" placeholder="@namakamu"></label>'+
  '<label class="f">Resolusi<select id="res"><option value="540"'+(S.res==540?" selected":"")+'>540 × 960 (ringan)</option><option value="720"'+(S.res==720?" selected":"")+'>720 × 1280</option><option value="1080"'+(S.res==1080?" selected":"")+'>1080 × 1920 (berat)</option></select></label></div>'+
  '<div class="sec"><h3>Suara</h3>'+a+'<label class="f">Atau pilih file voice-over sendiri<input type="file" id="aud" accept="audio/*"></label></div>';
}
function exportHTML(){
  var T=total();
  var h='<div class="sec"><h3>Ringkasan</h3><dl class="meta"><dt>Durasi</dt><dd>'+fmt(T)+'</dd><dt>Ukuran</dt><dd>'+S.res+' × '+Math.round(S.res*16/9)+'</dd><dt>Suara</dt><dd>'+(audio.buf?esc(audio.name):"tanpa suara")+'</dd></dl>'+
   '<button class="btn primary" id="rec"'+(recording?" disabled":"")+'>'+(recording?"Merekam…":"Rekam video")+'</button>'+
   '<div class="bar" id="bar" '+(recording?"":"hidden")+'><i></i></div>'+
   '<p class="note" id="msg">Video direkam secara langsung selama '+fmt(T)+'. Biarkan layar menyala dan tetap di halaman ini sampai selesai.</p></div>';
  if(resultState){
    h+='<div class="sec result"><h3>Hasil</h3><video id="resv" src="'+resultState.url+'" controls playsinline></video>'+
      '<button class="btn primary" id="savebtn">Simpan video ('+resultState.ext.toUpperCase()+', '+(resultState.blob.size/1048576).toFixed(1)+' MB)</button>'+
      '<p class="note" id="savemsg">'+(resultState.ext==="webm"?"HP ini merekam WebM. Kalau TikTok atau YouTube menolak, buka dulu di CapCut atau galeri lalu ekspor ulang sebagai MP4.":"Format MP4, siap diunggah.")+'</p></div>';
  }
  return h;
}
function renderPanel(){
  panel.innerHTML=tab==="script"?scriptHTML():tab==="scenes"?scenesHTML():tab==="style"?styleHTML():exportHTML();
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===tab)});
  sync();
}
document.querySelector(".tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;renderPanel()});

function sceneOf(el){var c=el.closest(".card");if(!c)return null;for(var i=0;i<S.scenes.length;i++)if(S.scenes[i].id===c.dataset.id)return i;return null}
panel.addEventListener("input",function(e){
  var el=e.target;
  if(el.dataset.f){
    var i=sceneOf(el);if(i===null)return;var f=el.dataset.f,v=el.value;
    if(f==="dur"){v=clamp(parseFloat(v)||1,1,40);var lab=el.closest(".card").querySelector(".seek span");lab.textContent=v.toFixed(1)+" dtk"}
    S.scenes[i][f]=v;
    if(f==="anim"||f==="dur"){playT=locate(playT).start+0.01}
    save();render();return;
  }
  var id=el.id;
  if(id==="handle"){S.handle=el.value;save();render()}
  else if(id==="script"){S.script=el.value;save()}
  else if(id==="gkey"){apiKey=el.value.trim();try{if(rememberKey)localStorage.setItem("pono-gkey",apiKey)}catch(e){}}
  else if(id==="grkey"){groqKey=el.value.trim();try{if(rememberKey)localStorage.setItem("pono-groqkey",groqKey)}catch(e){}}
  else if(id==="grmodelx"){S.gem.groq=el.value.trim();save()}
  else if(id==="cubase"){S.gem.cuBase=el.value.trim();save()}
  else if(id==="cukey"){cuKey=el.value.trim();cuIdx=0;try{if(rememberKey)localStorage.setItem("pono-cukey",cuKey)}catch(e){}}
  else if(id==="cutext"){S.gem.cuText=el.value.trim();save()}
  else if(id==="cuimg"){S.gem.cuImg=el.value.trim();save()}
  else if(id==="cusize"){S.gem.cuSize=el.value.trim();save()}
  else if(id==="gstyle"){S.gem.style=el.value;save()}
  else if(id==="gtts"){S.gem.tts=el.value.trim();save()}
  else if(id==="gtext"){S.gem.text=el.value.trim();save()}
  else if(id==="gimg"){S.gem.img=el.value.trim();save()}
  else if(id==="gimgstyle"){S.gem.imgStyle=el.value;save()}
  else if(id==="gcodestyle"){S.gem.codeStyle=el.value;save()}
});
panel.addEventListener("change",function(e){
  var el=e.target;
  if(el.dataset.f==="dur"){var i=sceneOf(el);if(i!==null)el.value=S.scenes[i].dur}
  if(el.id==="res"){S.res=+el.value;setRes();save();render()}
  if(el.id==="aud"&&el.files&&el.files[0])loadAudio(el.files[0]).then(renderPanel);
  if(el.id==="gvoice"){S.gem.voice=el.value;save()}
  if(el.id==="gai"){S.gem.ai=el.checked;save()}
  if(el.id==="gref"){S.gem.imgRef=el.checked;save()}
  if(el.id==="gauto"){S.gem.autoCode=el.checked;save()}
  if(el.id==="gimgsel"){if(el.value==="custom"){S.gem.imgCustom=true}else{S.gem.imgCustom=false;S.gem.img=el.value}save();renderPanel()}
  if(el.id==="cutextsel"){if(el.value==="custom"){S.gem.cuTextCustom=true}else{S.gem.cuTextCustom=false;S.gem.cuText=el.value}save();renderPanel()}
  if(el.id==="gprovimg"){S.gem.provImg=el.value;save();renderPanel()}
  if(el.id==="cuimode"){S.gem.cuImgMode=el.value;save();renderPanel()}
  if(el.id==="gprovtext"){S.gem.provText=el.value;save();renderPanel()}
  if(el.id==="gprovcode"){S.gem.provCode=el.value;save();renderPanel()}
  if(el.id==="grmodel"){if(el.value==="custom"){S.gem.groqCustom=true}else{S.gem.groqCustom=false;S.gem.groq=el.value}save();renderPanel()}
  if(el.id==="gtextsel"){if(el.value==="custom"){S.gem.textCustom=true}else{S.gem.textCustom=false;S.gem.text=el.value}save();renderPanel()}
  if(el.id==="glang"){S.gem.lang=el.value;save()}
  if(el.dataset.up&&el.files&&el.files[0]){var ui=sceneOf(el);if(ui!==null)importImage(el.files[0],ui).then(function(){renderPanel();render()});el.value=""}
  if(el.id==="bulkimg"&&el.files&&el.files.length){bulkImport(Array.prototype.slice.call(el.files));el.value=""}
  if(el.id==="gmode"){S.gem.imgMode=el.value;S.scenes.forEach(function(sc){if(imgs[sc.id])sc.imgMode=el.value});cache={};save();render()}
  if(el.id==="gremember"){rememberKey=el.checked;try{if(rememberKey){localStorage.setItem("pono-gkey",apiKey);localStorage.setItem("pono-groqkey",groqKey);localStorage.setItem("pono-cukey",cuKey)}else{localStorage.removeItem("pono-gkey");localStorage.removeItem("pono-groqkey");localStorage.removeItem("pono-cukey")}}catch(e){}}
});
panel.addEventListener("click",function(e){
  var tp=e.target.closest("[data-theme-pick]");
  if(tp){S.theme=tp.dataset.themePick;save();renderPanel();render();return}
  var b=e.target.closest("[data-act],#rec,#savebtn,#split,#tts,#imgs,#mkmaster,#cpprompts,#codes,#codesall,#grlist");if(!b)return;
  if(b.id==="grlist"){
    if(!groqKey){setMsg("Isi API key Groq dulu.","bad");return}
    setMsg("Mengambil daftar model dari Groq…");
    groqModels().then(function(ids){
      if(!ids.length){setMsg("Groq tidak mengembalikan model teks untuk key ini.","bad");return}
      if(ids.indexOf(S.gem.groq)<0){S.gem.groq=pickGroq(ids);S.gem.groqCustom=false;save()}
      renderPanel();setMsg(ids.length+" model tersedia. Terpilih: "+S.gem.groq,"ok");
    }).catch(function(err){setMsg("Gagal mengambil daftar model: "+(err&&err.message||err),"bad")});
    return;
  }
  if(b.id==="cpprompts"){copyPrompts(b);return}
  if(b.id==="codes"){genCodes(true);return}
  if(b.id==="codesall"){genCodes(false);return}
  if(b.id==="imgs"){genImages(true);return}
  if(b.id==="mkmaster"){makeMaster();return}
  if(b.id==="rec"){doExport();return}
  if(b.id==="savebtn"){saveResult();return}
  if(b.id==="split"){doSplit();return}
  if(b.id==="tts"){makeVoice();return}
  var act=b.dataset.act, i=sceneOf(b);
  if(act==="seek"){var loc=0;for(var q=0;q<i;q++)loc+=+S.scenes[q].dur;pause();playT=loc+(+S.scenes[i].dur)*0.85;if(audio.el)try{audio.el.currentTime=Math.min(playT,audio.dur)}catch(e2){};render()}
  else if(act==="up"&&i>0){var t=S.scenes[i];S.scenes[i]=S.scenes[i-1];S.scenes[i-1]=t;afterStructure()}
  else if(act==="down"&&i<S.scenes.length-1){var t2=S.scenes[i];S.scenes[i]=S.scenes[i+1];S.scenes[i+1]=t2;afterStructure()}
  else if(act==="dup"){var c=JSON.parse(JSON.stringify(S.scenes[i]));var oldId=c.id;c.id=uid();S.scenes.splice(i+1,0,c);
    if(imgs[oldId]){var u=imgs[oldId].url,fr0=imgs[oldId].frames,fps0=imgs[oldId].fps;setImg(c.id,u).then(function(){idbDo("readwrite",function(s){return s.put(u,c.id)});if(fr0)setAnimFrames(c.id,fr0,fps0);renderPanel();render()})}
    afterStructure()}
  else if(act==="del"&&S.scenes.length>1){dropImg(S.scenes[i].id);S.scenes.splice(i,1);afterStructure()}
  else if(act==="genimg"){genImages(false,i)}
  else if(act==="codeimg"){codeToImage(i)}
  else if(act==="delimg"){dropImg(S.scenes[i].id);save();renderPanel();render()}
  else if(act==="add"){S.scenes.push({id:uid(),label:"",text:"Judul *baru*",bullets:"",dur:3.5,anim:"reveal",speech:""});afterStructure(true)}
  else if(act==="fit"&&audio.buf){var T=total(),f=audio.dur/T;S.scenes.forEach(function(s){s.dur=Math.max(1,Math.round((+s.dur)*f*10)/10)});save();renderPanel();render()}
  else if(act==="noaudio"){clearAudio();renderPanel()}
});
function afterStructure(scrollEnd){
  save();pause();playT=Math.min(playT,total());renderPanel();render();
  if(scrollEnd){var cs=panel.querySelectorAll(".card");var last=cs[cs.length-1];if(last)last.scrollIntoView({block:"center"})}
}

/* ---------- audio ---------- */
function clearAudio(){if(audio.url)URL.revokeObjectURL(audio.url);audio={buf:null,url:null,el:null,name:"",dur:0,tts:false,sig:""}}
async function loadAudio(file){
  try{
    var ab=await file.arrayBuffer();
    var AC=window.AudioContext||window.webkitAudioContext, ac=new AC();
    var buf=await ac.decodeAudioData(ab.slice(0));
    try{ac.close()}catch(e){}
    clearAudio();
    var url=URL.createObjectURL(file), el=new Audio(url);el.preload="auto";
    audio={buf:buf,url:url,el:el,name:file.name,dur:buf.duration,tts:false,sig:""};
  }catch(err){
    clearAudio();
  }
}

/* ---------- export ---------- */
function pickMime(){
  if(!window.MediaRecorder)return null;
  var c=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  for(var i=0;i<c.length;i++)if(MediaRecorder.isTypeSupported(c[i]))return c[i];
  return "";
}
async function doExport(){
  if(recording||busy)return;
  var msg=function(t,cls){var m=document.getElementById("msg");if(m){m.textContent=t;m.className="note "+(cls||"")}};
  var mime=pickMime();
  if(mime===null||!cv.captureStream){msg("Browser ini belum bisa merekam video. Coba Chrome terbaru di Android.","bad");return}
  pause();recording=true;
  if(resultState){URL.revokeObjectURL(resultState.url);resultState=null}
  renderPanel();
  var wl=null;try{wl=await navigator.wakeLock.request("screen")}catch(e){}
  var T=total(), stream=cv.captureStream(30), ac=null, src=null;
  try{
    if(audio.buf){
      var AC=window.AudioContext||window.webkitAudioContext;ac=new AC();
      var dest=ac.createMediaStreamDestination();src=ac.createBufferSource();src.buffer=audio.buf;src.connect(dest);
      dest.stream.getAudioTracks().forEach(function(t){stream.addTrack(t)});
    }
    var rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:S.res>=1080?12e6:7e6}:undefined);
    var chunks=[];
    rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    var done=new Promise(function(res){rec.onstop=res});
    draw(0);
    await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})});
    warm(0);await new Promise(function(r){setTimeout(r,500)});
    rec.start(250);if(src)src.start();
    var t0=performance.now(), bar=document.querySelector("#bar>i");
    await new Promise(function(res){
      (function loop(){
        var t=(performance.now()-t0)/1000;
        draw(Math.min(t,T-0.001));
        if(bar)bar.style.width=Math.min(100,t/T*100)+"%";
        if(t>=T+0.25){res();return}
        requestAnimationFrame(loop);
      })();
    });
    rec.stop();await done;
    try{if(src)src.stop()}catch(e){}
    var type=(rec.mimeType||mime||"video/webm").split(";")[0];
    var blob=new Blob(chunks,{type:type});
    resultState={blob:blob,url:URL.createObjectURL(blob),ext:type.indexOf("mp4")>-1?"mp4":"webm"};
    recording=false;if(ac)try{ac.close()}catch(e){}
    if(wl)try{wl.release()}catch(e){}
    playT=0;renderPanel();render();
    var r=document.getElementById("resv");if(r)r.scrollIntoView({block:"center"});
  }catch(err){
    recording=false;if(ac)try{ac.close()}catch(e){}
    if(wl)try{wl.release()}catch(e){}
    renderPanel();msg("Perekaman gagal: "+(err&&err.message||err),"bad");
  }
}
async function saveResult(){
  var m=document.getElementById("savemsg");
  if(!resultState)return;
  if(!downloads){
    // outside claude.ai: normal browser download
    try{var a=document.createElement("a");a.href=resultState.url;a.download="pono-motion."+resultState.ext;document.body.appendChild(a);a.click();a.remove();
      if(m){m.textContent="Unduhan dimulai. Kalau tidak muncul, tekan lama pada video lalu pilih Unduh.";m.className="note ok"}}catch(e){}
    return;
  }
  try{
    await downloads.save({filename:"pono-motion."+resultState.ext,data:resultState.blob});
    if(m){m.textContent="Video disimpan.";m.className="note ok"}
  }catch(e){
    if(m){m.textContent=(e&&e.code==="declined")?"Penyimpanan dibatalkan. Ketuk lagi kalau mau menyimpan.":"Gagal menyimpan ("+(e&&e.code||"error")+"). Coba tekan lama pada video lalu pilih Unduh.";m.className="note bad"}
  }
}
try{
  if(window.claude&&window.claude.use)window.claude.use("downloads").then(function(d){downloads=d}).catch(function(){});
}catch(e){}

/* ---------- boot ---------- */
setRes();renderPanel();render();
idbOpen().then(function(db){
  idb=db;if(!db)return;
  return Promise.all(S.scenes.map(function(s){
    return idbDo("readonly",function(st){return st.get(s.id)}).then(function(u){return u?setImg(s.id,u).then(function(){return idbDo("readonly",function(st){return st.get("A:"+s.id)}).then(function(a){if(a&&a.frames&&imgs[s.id]){imgs[s.id].frames=a.frames;imgs[s.id].fps=a.fps||8}})}):false});
  })).then(function(){renderPanel();render()});
});
if(document.fonts&&document.fonts.load){
  Promise.all(['800 80px "Bricolage Grotesque"','500 34px "DM Sans"'].map(function(f){return document.fonts.load(f)})).then(function(){cache={};render()}).catch(function(){});
  document.fonts.ready.then(function(){cache={};render()});
}
})();
</script>
